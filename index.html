<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7fb">
<title>Social Media | Tapfone</title>
<style>
  :root { --ink:#171923; --muted:#667085; --card:#ffffff; --bg:#f6f7fb; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); }
  body { background:#ffffff; display:flex; justify-content:center; }
  .app { width:min(100%,480px); min-height:100svh; padding:22px 22px 18px; display:flex; flex-direction:column; align-items:center; }
  .brand { display:flex; flex-direction:column; align-items:center; text-decoration:none; color:inherit; margin:0 auto 10px; }
  .logo { width:clamp(125px,33vw,170px); aspect-ratio:1; object-fit:contain; display:block; mix-blend-mode:multiply; border-radius:18px; }
  h1 { font-size:clamp(30px,8vw,40px); line-height:1.08; letter-spacing:-1.2px; margin:8px 0 7px; text-align:center; }
  .subtitle { color:var(--muted); font-size:14px; margin:0 0 20px; text-align:center; }
  .social-list { width:100%; max-width:360px; display:grid; gap:10px; margin:auto 0; padding:0 0 18px; }
  .social-btn { width:100%; min-height:49px; display:flex; align-items:center; justify-content:center; gap:11px; border:0; border-radius:13px; color:#fff; font-size:16px; font-weight:750; letter-spacing:.1px; text-decoration:none; text-align:center; box-shadow:0 4px 10px #10182812; transition:transform .15s ease,filter .15s ease,box-shadow .15s ease; }
  .social-btn:hover { transform:translateY(-2px); filter:brightness(1.06); box-shadow:0 8px 18px #1018281c; }
  .social-btn:active { transform:scale(.985); }
  .social-btn:focus-visible { outline:3px solid #111827; outline-offset:3px; }
  .icon { width:22px; height:22px; display:inline-grid; place-items:center; flex:0 0 22px; }
  .icon svg { width:22px; height:22px; fill:currentColor; display:block; }
  .facebook {background:#1877F2}.instagram {background:linear-gradient(115deg,#833AB4,#E1306C 55%,#FCAF45)}
  .linkedin {background:#0A66C2}.pinterest {background:#BD081C}.reddit {background:#FF4500}
  .snapchat {background:#FFFC00;color:#111}.tiktok {background:#111}
  .x-twitter {background:#000}.youtube {background:#FF0033}
  footer { color:#7a8190; font-size:12px; padding:16px 0 3px; text-align:center; }
  .hint { font-size:11px; color:#8b93a3; text-align:center; margin:0 0 8px; }
  @media (min-height:850px) { .app { padding-top:28px; padding-bottom:22px; } .social-list { gap:12px; } .social-btn { min-height:52px; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
</style>
</head>
